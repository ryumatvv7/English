/* ---------- Abläufe: Schritte ordnen ---------- */
const SQ={list:[],i:0,placed:[],pool:[],checked:false,ok:false,score:0};
function seqStart(list){ if(!list.length)return; hideSide(); SQ.list=list; SQ.i=0; SQ.score=0; seqLoad(); }
function seqLoad(){ const s=SQ.list[SQ.i]; SQ.placed=[]; SQ.pool=shuffle(s.steps.map((_,k)=>k)); SQ.checked=false; SQ.ok=false; seqView(); window.scrollTo(0,0); }
function seqOrders(s){ return [s.steps.map((_,k)=>k)].concat(s.alt||[]); }
function seqBest(s){ let best=null,bm=-1; seqOrders(s).forEach(o=>{const m=o.filter((v,k)=>SQ.placed[k]===v).length; if(m>bm){bm=m;best=o}}); return best; }
function seqView(){
  const s=SQ.list[SQ.i], n=SQ.list.length, last=SQ.i===n-1;
  const best=SQ.checked?seqBest(s):null;
  const placedHtml=SQ.placed.map((k,pos)=>{const cls=SQ.checked?(best[pos]===k?"right":"wrong"):"placed";
    return `<li><button class="step ${cls}" data-p="${pos}" ${SQ.checked?"disabled":""}><span class="no">${pos+1}.</span><span>${esc(s.steps[k])}</span></button></li>`}).join("");
  const free=SQ.pool.filter(k=>!SQ.placed.includes(k));
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">← Übersicht</button><span class="stats">Ablauf ${SQ.i+1} / ${n} · ${SQ.score} richtig</span></div>
  <div class="bar"><i style="width:${(SQ.i+(SQ.checked?1:0))/n*100}%"></i></div>
  <section class="panel">
    <div class="qhead"><span class="type">Schritte ordnen</span><span class="label">${esc(TOPICS[s.t])}</span></div>
    <h3>${esc(s.title)}</h3>
    <span class="label">Deine Reihenfolge${SQ.checked?"":" · antippen zum Entfernen"}</span>
    <ol class="steps">${placedHtml||`<li class="slot">Tippe unten die Schritte in der richtigen Reihenfolge an.</li>`}</ol>
    ${free.length?`<span class="label">Schritte</span><ul class="steps">${free.map(k=>`<li><button class="step" data-k="${k}"><span class="no">+</span><span>${esc(s.steps[k])}</span></button></li>`).join("")}</ul>`:""}
    <div id="fb">${SQ.checked?`<div class="verdict ${SQ.ok?"ok":"bad"}"><strong>${SQ.ok?"Richtig":"Nicht ganz"}</strong><span>Richtige Reihenfolge:</span><ol class="clist">${seqOrders(s)[0].map(k=>`<li>${esc(s.steps[k])}</li>`).join("")}</ol></div><div class="note">${esc(s.note)}<br><span class="stats">Quelle: ${esc(s.src)}</span></div>`:""}</div>
    <div class="row">${SQ.checked?`<button class="btn" id="next">${last?"Fertig":"Nächster Ablauf →"}</button>${SQ.ok?"":`<button class="btn ghost" id="retry">Nochmal</button>`}`:`<button class="btn" id="chk" ${free.length?"disabled":""}>Prüfen</button><button class="btn ghost" id="reset" ${SQ.placed.length?"":"disabled"}>Zurücksetzen</button><button class="btn ghost" id="skip" ${last?"disabled":""}>Überspringen</button>`}</div>
  </section>`;
  const $=x=>app.querySelector(x);
  $("#back").onclick=home;
  app.querySelectorAll(".step[data-k]").forEach(b=>b.onclick=()=>{SQ.placed.push(+b.dataset.k);seqView()});
  if(!SQ.checked) app.querySelectorAll(".step[data-p]").forEach(b=>b.onclick=()=>{SQ.placed.splice(+b.dataset.p,1);seqView()});
  if($("#chk"))$("#chk").onclick=()=>{SQ.checked=true;SQ.ok=seqOrders(s).some(o=>o.every((v,k)=>SQ.placed[k]===v));
    if(SQ.ok){SQ.score++;seqDone[s.id]=1;store.set("en1_seq",seqDone);} seqView();};
  if($("#reset"))$("#reset").onclick=()=>{SQ.placed=[];seqView()};
  if($("#skip"))$("#skip").onclick=()=>{SQ.i++;seqLoad()};
  if($("#retry"))$("#retry").onclick=()=>{seqLoad()};
  if($("#next"))$("#next").onclick=()=>{ if(last)home(); else {SQ.i++;seqLoad();} };
}

/* ---------- Offene Fragen ---------- */
let oqScore=store.get("en1_oq",{}), oqText=store.get("en1_oqt",{});
const OQ={};
function oqStart(list){ if(!list.length)return; hideSide(); OQ.list=list; OQ.i=0; oqLoad(); }
function oqLoad(){ OQ.shown=false; OQ.ck=new Set(); OQ.ai=null; oqView(); window.scrollTo(0,0); }
function oqView(){
  const o=OQ.list[OQ.i], n=OQ.list.length, last=OQ.i===n-1, txt=oqText[o.id]||"";
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">← Übersicht</button><span class="stats">Frage ${OQ.i+1} / ${n}${oqScore[o.id]!=null?` · zuletzt ${oqScore[o.id]}/${o.pts.length}`:""}</span></div>
  <div class="bar"><i style="width:${(OQ.i+(OQ.shown?1:0))/n*100}%"></i></div>
  <section class="panel">
    <div class="qhead"><span class="type">Offene Frage</span>${o.ex?`<span class="oq-tag">aus der Prüfung</span>`:""}<span class="label">${esc(TOPICS[o.t])}</span></div>
    <p class="q">${esc(o.q)}</p>
    <textarea class="oq-ta" id="ta" placeholder="Write your answer in English …">${esc(txt)}</textarea>
    <div class="row">${OQ.shown?"":`<button class="btn" id="show">Musterantwort zeigen</button>`}</div>
    <div id="aiOut" class="ai"></div>
    ${OQ.shown?`<span class="label">Kernpunkte – abhaken, was du geschrieben hast</span>
    <ul class="oq-pts">${o.pts.map((p,i)=>`<li><label><input type="checkbox" data-i="${i}" ${OQ.ck.has(i)?"checked":""}><span>${esc(p)}</span></label></li>`).join("")}</ul>
    <div class="stats" id="sc">${OQ.ck.size} / ${o.pts.length} Punkte · ${Math.round(OQ.ck.size/o.pts.length*100)} %</div>
    <span class="label">Musterantwort</span><div class="oq-model">${esc(o.a)}</div>
    ${o.miss?`<div class="note">⚠ ${esc(o.miss)}</div>`:""}`:""}
    <div class="row"><button class="btn ghost" id="prev" ${OQ.i?"":"disabled"}>← Zurück</button><button class="btn ${OQ.shown?"":"ghost"}" id="next">${last?"Fertig":"Nächste Frage →"}</button></div>
  </section>`;
  const $=x=>app.querySelector(x), ta=$("#ta");
  ta.oninput=()=>{oqText[o.id]=ta.value;store.set("en1_oqt",oqText);};
  $("#back").onclick=home;
  if($("#show"))$("#show").onclick=()=>{OQ.shown=true;oqView();};
  app.querySelectorAll(".oq-pts input").forEach(c=>c.onchange=()=>{const i=+c.dataset.i;c.checked?OQ.ck.add(i):OQ.ck.delete(i);
    oqScore[o.id]=OQ.ck.size;store.set("en1_oq",oqScore);$("#sc").textContent=`${OQ.ck.size} / ${o.pts.length} Punkte · ${Math.round(OQ.ck.size/o.pts.length*100)} %`;});
  $("#prev").onclick=()=>{OQ.i--;oqLoad();};
  $("#next").onclick=()=>{ if(last)home(); else {OQ.i++;oqLoad();} };
  const out=$("#aiOut"); if(OQ.ai)out.innerHTML=mini(OQ.ai);

}

/* ---------- Zuordnen (Drag & Drop) ---------- */
let mtDone=store.get("en1_mt",{});
const MT={};
function mtStart(list){ if(!list.length)return; hideSide(); MT.list=list; MT.i=0; MT.score=0; mtLoad(); }
function mtLoad(){ const m=MT.list[MT.i]; MT.at=m.items.map(()=>-1); MT.order=shuffle(m.items.map((_,k)=>k)); MT.sel=null; MT.checked=false; MT.ok=false; mtView(); window.scrollTo(0,0); }
function mtChip(m,k){ const b=MT.at[k], cls=MT.checked?(b===m.items[k][1]?"right":"wrong"):(MT.sel===k?"sel":"");
  return `<button class="chipd ${cls}" data-k="${k}" ${MT.checked?"disabled":""}>${esc(m.items[k][0])}${MT.checked&&b!==m.items[k][1]?`<span class="fix">→ ${esc(m.bins[m.items[k][1]])}</span>`:""}</button>`; }
function mtMove(k,b){ MT.at[k]=b; MT.sel=null; mtView(); }
function mtView(){
  const m=MT.list[MT.i], n=MT.list.length, last=MT.i===n-1, free=MT.order.filter(k=>MT.at[k]<0);
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">← Übersicht</button><span class="stats">Aufgabe ${MT.i+1} / ${n} · ${MT.score} richtig</span></div>
  <div class="bar"><i style="width:${(MT.i+(MT.checked?1:0))/n*100}%"></i></div>
  <section class="panel">
    <div class="qhead"><span class="type">Zuordnen</span><span class="label">${esc(TOPICS[m.t])}</span></div>
    <h3>${esc(m.title)}</h3>
    ${MT.checked?"":`<span class="label">Begriffe · ziehen oder antippen</span><div class="mt-pool" data-b="-1">${free.map(k=>mtChip(m,k)).join("")||`<span class="stats">Alles verteilt – jetzt prüfen.</span>`}</div>`}
    <div class="mt-bins">${m.bins.map((h,b)=>`<div class="mt-bin" data-b="${b}"><h4>${esc(h)}</h4><div class="drop">${MT.order.filter(k=>MT.at[k]===b).map(k=>mtChip(m,k)).join("")}</div></div>`).join("")}</div>
    <div id="fb">${MT.checked?`<div class="verdict ${MT.ok?"ok":"bad"}"><strong>${MT.ok?"Richtig":"Nicht ganz"}</strong><span>${MT.at.filter((b,k)=>b===m.items[k][1]).length} / ${m.items.length} richtig zugeordnet</span></div><div class="note">${esc(m.note)}<br><span class="stats">Quelle: ${esc(m.src)}</span></div>`:""}</div>
    <div class="row">${MT.checked?`<button class="btn" id="next">${last?"Fertig":"Nächste Aufgabe →"}</button>${MT.ok?"":`<button class="btn ghost" id="retry">Nochmal</button>`}`:`<button class="btn" id="chk" ${free.length?"disabled":""}>Prüfen</button><button class="btn ghost" id="reset">Zurücksetzen</button><button class="btn ghost" id="skip" ${last?"disabled":""}>Überspringen</button>`}</div>
  </section>`;
  const $=x=>app.querySelector(x);
  $("#back").onclick=home;
  if(!MT.checked){
    app.querySelectorAll(".chipd").forEach(c=>mtDrag(c));
    app.querySelectorAll(".mt-bin,.mt-pool").forEach(z=>z.addEventListener("click",e=>{ if(MT.sel!==null&&!e.target.closest(".chipd"))mtMove(MT.sel,+z.dataset.b); }));
    $("#chk").onclick=()=>{MT.checked=true;MT.ok=MT.at.every((b,k)=>b===m.items[k][1]);
      if(MT.ok){MT.score++;mtDone[m.id]=1;store.set("en1_mt",mtDone);} mtView();};
    $("#reset").onclick=()=>mtLoad();
    $("#skip").onclick=()=>{MT.i++;mtLoad()};
  } else {
    if($("#retry"))$("#retry").onclick=()=>mtLoad();
    $("#next").onclick=()=>{ if(last)home(); else {MT.i++;mtLoad();} };
  }
}
function mtDrag(c){
  const k=+c.dataset.k; let sx,sy,g=null,over=null;
  c.addEventListener("pointerdown",e=>{ if(e.button>0)return; sx=e.clientX;sy=e.clientY; c.setPointerCapture(e.pointerId);
    const mv=ev=>{ if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
      if(!g){g=c.cloneNode(true);g.classList.add("ghost");g.style.width=c.offsetWidth+"px";document.body.appendChild(g);c.style.opacity=".3";}
      g.style.left=(ev.clientX-g.offsetWidth/2)+"px";g.style.top=(ev.clientY-g.offsetHeight/2)+"px";
      const z=document.elementFromPoint(ev.clientX,ev.clientY);const zone=z&&z.closest(".mt-bin,.mt-pool");
      if(zone!==over){over&&over.classList.remove("over");over=zone;over&&over.classList.add("over");}
      ev.preventDefault(); };
    const up=()=>{ c.removeEventListener("pointermove",mv);c.removeEventListener("pointerup",up);c.removeEventListener("pointercancel",up);
      if(g){g.remove();g=null; if(over)mtMove(k,+over.dataset.b); else {c.style.opacity="";} }
      else { if(MT.at[k]>=0&&MT.sel===null) mtMove(k,-1); else {MT.sel=MT.sel===k?null:k; mtView();} } };
    c.addEventListener("pointermove",mv);c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
  });
}
function checklists(){
  hideSide();
  const groups={};SEQ.forEach(s=>(groups[s.t]=groups[s.t]||[]).push(s));
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">← Übersicht</button><button class="btn sm" id="ord">Schritte ordnen</button></div>
  <header class="head"><div class="label">Abläufe zum Lernen</div><h1>Checklisten</h1><p class="sub">Alle Schritte in der üblichen Reihenfolge. ✓ = schon richtig geordnet.</p></header>
  ${CHECK.map(c=>`<section class="panel${/Prüfung/.test(c.title)?" missing":""}"><h3>${esc(c.title)}</h3><ul class="clist">${c.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><span class="stats">Quelle: ${esc(c.src)}</span></section>`).join("")}
  ${Object.keys(TOPICS).filter(t=>groups[t]).map(t=>`<h2>${esc(TOPICS[t])}</h2>${groups[t].map(s=>`<section class="panel"><div class="qhead"><h3>${esc(s.title)}</h3><span class="stats">${seqDone[s.id]?"✓ geordnet":""}</span></div><ol class="clist">${s.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><div class="note">${esc(s.note)}</div><span class="stats">Quelle: ${esc(s.src)}</span></section>`).join("")}`).join("")}`;
  app.querySelector("#back").onclick=home;
  app.querySelector("#ord").onclick=()=>seqStart(shuffle(SEQ));
  window.scrollTo(0,0);
}
function konspekt(jump){
  hideSide();
  const names=["Zahlen","Staff","Hospital","False friends","Equipment","Routines","Body & First aid","Admission","Discharge & Vokabeln","Merkhilfen","Fallen","Wörterbuch"];
  app.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">← Übersicht</button><button class="btn sm" id="qz">Fragen üben</button></div>
  <header class="head"><div class="status"><span class="dot"></span>Lernzettel · Lehrbuch S. 1–45</div><h1><span class="x">English 1</span> Konspekt</h1></header>
  <nav class="knav" aria-label="Kapitel">${names.map((n,i)=>`<a href="#k${i+1}" data-k="k${i+1}">${i+1} ${n}</a>`).join("")}</nav>
  <div class="ksp" id="ksp"></div>`;
  app.querySelector("#ksp").appendChild(document.getElementById("kspTpl").content.cloneNode(true));
  app.querySelector("#back").onclick=home;
  app.querySelector("#qz").onclick=()=>{const p=B.filter(q=>S.sel.has(q.t));start(shuffle(p),"Üben")};
  app.querySelectorAll(".knav a").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.k);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})});
  if(jump){const el=document.getElementById(jump);if(el)requestAnimationFrame(()=>el.scrollIntoView({block:"start"}));}else window.scrollTo(0,0);
}
tick();
home();
</script>
