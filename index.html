<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="description" content="English 1 – Medical English Prüfungstrainer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English 1 · Medical English Prüfungstrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column of frosted-glass cards (Apple-style "liquid glass"), light/dark follows the system. Fehleranalyse docks right on wide screens; clock/timer as a floating glass pill bottom-right. */
:root{
  --bg:#eef1f7; --bg2:#f7f8fb;
  --panel:rgba(255,255,255,.62); --panel-hi:rgba(255,255,255,.8); --panel-solid:#fff;
  --ink:#1d1d1f; --muted:#6e6e73; --qink:#000;
  --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.16); --hl:rgba(255,255,255,.75);
  --accent:#007aff; --accent-ink:#fff; --accent-soft:rgba(0,122,255,.10); --glow:rgba(0,122,255,.25);
  --ok:#248a3d; --ok-soft:rgba(52,199,89,.14); --bad:#d70015; --bad-soft:rgba(255,59,48,.10); --bad-line:rgba(255,59,48,.35);
  --warn:#c93400; --hudbg:rgba(255,255,255,.6); --fill:rgba(118,118,128,.12);
  --blob1:rgba(0,122,255,.28); --blob2:rgba(175,82,222,.22); --blob3:rgba(52,199,89,.18);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  --r:22px; --r-s:14px; --gap:14px;
  --glass:blur(28px) saturate(180%);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 8px 28px rgba(0,0,0,.07);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --bg2:#0b0b0f;
  --panel:rgba(44,44,48,.55); --panel-hi:rgba(58,58,62,.7); --panel-solid:#1c1c1e;
  --ink:#f5f5f7; --muted:#98989d; --qink:#fff;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.2); --hl:rgba(255,255,255,.14);
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.18); --glow:rgba(10,132,255,.35);
  --ok:#30d158; --ok-soft:rgba(48,209,88,.16); --bad:#ff453a; --bad-soft:rgba(255,69,58,.15); --bad-line:rgba(255,69,58,.45);
  --warn:#ff9f0a; --hudbg:rgba(44,44,48,.6); --fill:rgba(118,118,128,.24);
  --blob1:rgba(10,132,255,.30); --blob2:rgba(191,90,242,.24); --blob3:rgba(48,209,88,.14);
  --shadow:0 8px 30px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;font-weight:400;line-height:1.47;letter-spacing:-.01em;min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(40vmax 40vmax at 8% 0%, var(--blob1), transparent 70%),
    radial-gradient(38vmax 38vmax at 100% 18%, var(--blob2), transparent 70%),
    radial-gradient(40vmax 40vmax at 40% 100%, var(--blob3), transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) 96px}
::selection{background:var(--accent-soft)}
.layout{display:grid;gap:20px;max-width:1220px;margin:0 auto;align-items:start}
.wrap{width:100%;max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
@media (min-width:1100px){
  .layout.has-side{grid-template-columns:minmax(0,700px) minmax(0,440px);justify-content:center}
  .layout.has-side .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 120px);overflow:auto}
}
/* glass surface */
.panel,.side,.mode,.counter,.ksp section,.knav,.hud-box{background:var(--panel);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
/* header */
.head{display:flex;flex-direction:column;gap:6px;padding:6px 4px 2px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,7.5vw,44px);line-height:1.05;margin:0;letter-spacing:-.025em;color:var(--qink);text-wrap:balance}
h1 .x{color:var(--accent)}
h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0;letter-spacing:-.015em;color:var(--qink)}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;color:var(--qink);letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;max-width:62ch;font-size:15.5px}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.ecg{display:none}
.panel{position:relative;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.panel.resume{border-color:var(--glow)}
.panel.missing{border-color:rgba(255,149,0,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14.5px;font-weight:500;border:1px solid transparent;background:var(--fill);color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-align:left;transition:background .15s,color .15s}
.chip .n{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--glow)}
.chip[aria-pressed="true"] .n{color:var(--accent);opacity:.75}
.chip:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.tight{gap:6px}
.btn{font:inherit;font-weight:600;font-size:16px;padding:11px 22px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;transition:transform .12s,filter .15s;box-shadow:0 4px 14px var(--glow)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.ghost{background:var(--fill);color:var(--accent);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:14.5px}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn:focus-visible,.chip:focus-visible,.mode:focus-visible,.cell:focus-visible,.counter:focus-visible,.step:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--glow);outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{font:inherit;text-align:left;border-radius:var(--r);color:var(--ink);padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;transition:transform .12s,background .15s}
.mode:active:not(:disabled){transform:scale(.98)}
.mode b{font-size:18px;font-weight:650;color:var(--qink);letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto}
.mode span{color:var(--muted);font-size:14.5px;line-height:1.35}
.mode.hot{background:linear-gradient(135deg,var(--accent),#5e5ce6);border-color:transparent}
.mode.hot b,.mode.hot span{color:#fff}
.mode.hot span{opacity:.9}
.mode:disabled{opacity:.4;cursor:default}
.bar{height:6px;overflow:hidden;border-radius:99px;background:var(--fill)}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .25s;background:var(--accent)}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.type{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;color:var(--accent);background:var(--accent-soft)}
.type.mc{color:var(--warn);background:rgba(255,149,0,.14)}
.type.txt{color:#8944ab;background:rgba(175,82,222,.14)}
.q{font-size:20.5px;font-weight:600;margin:0;line-height:1.35;text-wrap:pretty;color:var(--qink);overflow-wrap:anywhere;letter-spacing:-.015em}
.q .neg{color:var(--bad);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid transparent;border-radius:var(--r-s);padding:12px 14px;cursor:pointer;background:var(--fill);-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere;transition:background .15s,border-color .15s}
.opt input{margin-top:3px;width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .tag{margin-left:auto;font-size:12.5px;font-weight:600;white-space:nowrap;padding-top:3px}
.opt.right .tag{color:var(--ok)}.opt.wrong .tag{color:var(--bad)}.opt.missed .tag{color:var(--ok)}
@media (hover:hover){
  .chip:hover:not(:disabled):not([aria-pressed="true"]){background:var(--line-strong)}
  .mode:hover:not(:disabled):not(.hot){background:var(--panel-hi)}
  .opt:hover:not(.sel):not(.right):not(.wrong){border-color:var(--line-strong)}
  .btn:hover:not(:disabled){filter:brightness(1.08)}
  .step:hover:not(:disabled){border-color:var(--line-strong)}
}
.verdict{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-radius:var(--r-s)}
.verdict.ok{background:var(--ok-soft)}
.verdict.bad{background:var(--bad-soft)}
.verdict strong{font-size:17px;font-weight:700}
.verdict.ok strong{color:var(--ok)} .verdict.bad strong{color:var(--bad)}
.score{font-family:var(--f-display);font-weight:700;font-size:68px;line-height:.95;letter-spacing:-.03em;color:var(--qink);font-variant-numeric:tabular-nums}
.score .of{font-size:28px;color:var(--muted)}
.pill{display:inline-block;font-weight:600;padding:5px 14px;border-radius:999px}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)}
.wrongs{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.wrongs li{background:var(--fill);border-radius:var(--r-s);padding:10px 12px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.wrongs .a{color:var(--muted);font-size:15.5px}
.wrongs .a.mine{color:var(--bad)}
.wrongs .a.ex{font-size:14.5px}
.stats{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.side{border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.side h2{color:var(--bad)}
.side .sec{display:flex;flex-direction:column;gap:8px}
.ana{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ana li{background:var(--fill);border-radius:12px;padding:8px 12px;font-size:15.5px;overflow-wrap:anywhere}
.ana li.must{box-shadow:inset 3px 0 0 var(--ok)}
.ana li.err{background:var(--bad-soft)}
.ana .st{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ana li.err .st{color:var(--bad)}
.key{font-size:15.5px;border-radius:12px;padding:10px 12px;background:var(--accent-soft)}
.key.warnkey{background:var(--bad-soft)}
.key b{color:var(--bad)}
.ai{font-size:16px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.ai p{margin:0}
.ai .li{padding-left:14px;text-indent:-12px}
.ai b{color:var(--accent);font-weight:650}
.ai .wait{color:var(--muted);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.side .btn{padding:9px 16px;font-size:15px}
/* floating glass pills */
.hud{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:20;pointer-events:none}
.hud-box{border-radius:999px;padding:6px 14px;display:flex;align-items:baseline;gap:8px}
.hud-l{font-size:11px;font-weight:600;color:var(--muted)}
#clock,#timer{font-weight:600;font-size:18px;color:var(--qink);font-variant-numeric:tabular-nums}
.hud-box.low{background:var(--bad-soft);border-color:var(--bad-line)} .hud-box.low #timer{color:var(--bad)}
.hud-box.sig .tag{font-size:13px;color:var(--muted);font-weight:500}
[hidden]{display:none!important}
.navbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.navbar .btn.sm{font-size:22px;line-height:1;padding:6px 16px}
.counter{font:inherit;font-size:14px;color:var(--muted);border-radius:999px;padding:8px 10px;cursor:pointer;text-align:center}
.counter b{color:var(--qink);font-size:19px;font-weight:700}
.counter .caret{color:var(--accent);margin-left:4px}
.gridp{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:260px;overflow:auto}
.cell{font:inherit;font-size:13px;height:36px;border:0;border-radius:10px;background:var(--fill);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-soft);color:var(--ok)}
.cell.bad{background:var(--bad-soft);color:var(--bad)}
.cell.ans{background:var(--accent-soft);color:var(--accent)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--qink)}
.legend{gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i.cell{width:14px;height:14px;display:inline-block;cursor:default;border-radius:4px}
.cfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Abläufe / Zuordnen */
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.mt-pool,.mt-bin .drop{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:8px;border:1.5px dashed var(--line-strong);border-radius:var(--r-s);background:var(--fill)}
.mt-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.mt-bin{min-width:0}.mt-bin h4{margin:0 0 6px;overflow-wrap:anywhere;font-size:14px;font-weight:600;color:var(--ink)}
.mt-bin.over .drop,.mt-pool.over{border-color:var(--accent);background:var(--accent-soft)}
.chipd{font:inherit;font-size:15px;padding:8px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel-solid);color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chipd.sel{outline:2px solid var(--accent)}
.chipd.right{border-color:var(--ok);color:var(--ok)}.chipd.wrong{border-color:var(--bad);color:var(--bad)}
.chipd.ghost{position:fixed;pointer-events:none;z-index:999;opacity:.95;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.chipd .fix{display:block;font-size:12px;opacity:.85}
.oq-ta,.txtin{width:100%;font:inherit;font-size:17px;line-height:1.5;background:var(--fill);color:var(--qink);border:1.5px solid transparent;border-radius:var(--r-s);padding:12px 14px;outline:none}
.oq-ta{min-height:180px;resize:vertical;font-size:16px}
.oq-ta:focus,.txtin:focus{border-color:var(--accent);background:var(--panel-solid)}
.txtrow{margin:4px 0 8px}
.txtin.right{border-color:var(--ok);color:var(--ok)}
.txtin.wrong{border-color:var(--bad);color:var(--bad)}
.oq-pts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.oq-pts label{display:flex;gap:10px;align-items:flex-start;background:var(--fill);border:1.5px solid transparent;border-radius:12px;padding:9px 12px;cursor:pointer;font-size:15.5px;overflow-wrap:anywhere}
.oq-pts input{margin-top:3px;width:18px;height:18px;accent-color:var(--ok);flex:none}
.oq-pts label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.oq-model{white-space:pre-line;font-size:15.5px;line-height:1.55;border-radius:var(--r-s);padding:10px 14px;background:var(--accent-soft)}
.oq-tag{font-size:12px;font-weight:600;color:var(--warn);background:rgba(255,149,0,.14);border-radius:999px;padding:3px 9px}
.step{font:inherit;font-size:16.5px;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;border:1.5px solid transparent;border-radius:var(--r-s);padding:11px 13px;background:var(--fill);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.step .no{font-size:14px;font-weight:700;color:var(--accent);min-width:22px;padding-top:1px;font-variant-numeric:tabular-nums}
.step.placed{border-color:var(--accent);background:var(--accent-soft)}
.step.right{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.step.wrong{border-color:var(--bad);background:var(--bad-soft);cursor:default}
.step:disabled{cursor:default}
.slot{border:1.5px dashed var(--line-strong);border-radius:var(--r-s);padding:10px 12px;color:var(--muted);font-size:14px}
.clist{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:26px}
.clist li{padding-left:4px;overflow-wrap:anywhere}
.clist li::marker{color:var(--accent);font-weight:600}
.note{font-size:15px;color:var(--muted);background:var(--fill);border-radius:12px;padding:8px 12px}
/* Konspekt (eingebettet) */
.ksp{display:flex;flex-direction:column;gap:var(--gap);font-size:15.5px;line-height:1.5}
.ksp section{border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.ksp h2{font-size:21px;margin:0 0 4px}
.ksp h3{color:var(--accent);font-size:17px;font-weight:650;margin:10px 0 2px}
.ksp p{margin:0 0 4px}
.ksp ul,.ksp ol{margin:0 0 6px;padding-left:22px}
.ksp li{margin:0 0 3px;overflow-wrap:anywhere}
.ksp li::marker{color:var(--accent)}
.ksp b{color:var(--qink);font-weight:650}
.ksp .ru{color:var(--muted);font-size:.86em;font-weight:400;font-style:normal}
.ksp .ru::before{content:"("}.ksp .ru::after{content:")"}
.ksp .rub{display:block;color:var(--muted);font-size:.9em;margin-top:3px}
.ksp .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ksp .cols>div{min-width:0}
@media (max-width:760px){.ksp .cols{grid-template-columns:1fr}}
.ksp .tw{overflow-x:auto;margin:4px 0 8px;border-radius:12px;border:1px solid var(--line)}
.ksp table{border-collapse:collapse;width:100%;font-size:14px}
.ksp th,.ksp td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.ksp tr:last-child>*{border-bottom:0}
.ksp th{background:var(--fill);color:var(--qink);font-weight:600}
.ksp td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.ksp .eq td{width:33%}
.ksp ol.cols2{columns:2 240px;column-gap:28px}
.ksp ol.cols2 li{break-inside:avoid}
.ksp .box{border-radius:var(--r-s);padding:11px 13px;margin:4px 0 8px;background:var(--fill)}
.ksp .merk{background:var(--accent-soft)}
.ksp .merk::before{content:"Merke";display:block;font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:3px}
.ksp .falle{background:var(--bad-soft)}
.ksp .falle::before{content:"Falle";display:block;font-size:12.5px;font-weight:700;color:var(--bad);margin-bottom:3px}
.ksp .src,.ksp .small{font-size:13.5px;color:var(--muted)}
.ksp .sub{font-size:15px}
.ksp .toc{display:none}
.ksp .cover>h3{display:none}
.ksp .num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ksp .num-grid div{border-radius:var(--r-s);padding:10px 12px;background:var(--fill)}
.ksp .num-grid b{display:block;font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.ksp .num-grid span{font-size:13px;color:var(--ink)}
.ksp .dict{columns:2 260px;column-gap:24px;font-size:14.5px}
.ksp .dict p{break-inside:avoid;margin:0 0 5px}
.ksp .dict .ru::before,.ksp .dict .ru::after{content:""}
.ksp .dict .ru{font-size:.95em}
.knav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:15;border-radius:999px;padding:6px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.knav::-webkit-scrollbar{display:none}

<!-- ============ 2 STAFF ============ -->
<section class="sec" id="k2">
<h2>2 · Nursing careers &amp; medical staff (S. 6–12) ★</h2>
<h3>Perioperative team (S. 6/7)</h3>
<div class="tw"><table><tr><th>Scrub Nurse</th><td>bleibt steril, reicht Instrumente (z. B. <b>forceps</b>) <i class="ru" data-en="instrument nurse">instrument nurse</i></td></tr>
<tr><th>Circulating Nurse</th><td>organisiert OP-Saal und Material; <b>preoperative surgical count</b> (sponges, needles, instruments) <i class="ru" data-en="counting so nothing is left inside">counting so nothing is left inside</i></td></tr>
<tr><th>Recovery Nurse</th><td>Patient im <b>PACU</b> = Post-Anesthesia Care Unit nach der OP <i class="ru" data-en="recovery room">recovery room</i></td></tr>
<tr><th>Nurse Anesthetist (CRNA)</th><td>gibt Anästhesie, überwacht Vitalzeichen</td></tr></table></div>
<p><b>perioperative</b> = rund um die OP (vor/während/nach) – also OR <b>und</b> PACU · <b>asystole</b> = no heartbeat → <b>perform CPR</b> · <b>gowning and gloving</b> = sterilen Kittel + Handschuhe anziehen → <b>sterile field</b> · <b>OR</b> (AmE) = <b>OT</b> (BrE) · <b>the BP drops</b> <i class="ru" data-en="blood pressure falls">blood pressure falls</i></p>
<h3>WHO is WHO – Nursing staff (S. 8/9)</h3>
<div class="tw"><table><tr><th>English</th><th>Deutsch</th><th>Aufgabe</th></tr>
<tr><td><b>Chief Nursing Officer (CNO)</b></td><td>Pflegedienstleitung</td><td>höchste Position, <b>alle</b> Pflegebereiche, Strategie &amp; Policy; Master+ <i class="ru" data-en="top nurse of the hospital">top nurse of the hospital</i></td></tr>
<tr><td><b>Lead Nurse</b></td><td>Leitende Pflegekraft</td><td><b>mehrere</b> Stationen/Abteilungen, Audits, Qualität, Personalentwicklung, unterstützt CNO</td></tr>
<tr><td><b>Head Nurse</b></td><td>Stationsleitung</td><td><b>eine</b> Station: Personal (+ Reinigung), Beurteilung, <b>Budget</b>, Dienstplan <i class="ru" data-en="ward manager">ward manager</i></td></tr>
<tr><td><b>Charge Nurse</b></td><td>Schichtleitung</td><td>Station während <b>der Schicht</b>; Ansprechperson, teilt Pat. zu, Übergaben <i class="ru" data-en="shift leader">shift leader</i></td></tr>
<tr><td><b>APRN / APN</b> (z. B. <b>NP</b>, CRNA)</td><td>DGKP mit erweiterter Ausbildung</td><td>mind. <b>Master</b>; NP ≈ wie GP: Anamnese, Erstuntersuchung, Tests, <b>Rezepte</b>, kleine Erkrankungen; GP surgeries &amp; A&amp;E</td></tr>
<tr><td><b>Registered Nurse (RN)</b></td><td>DGKP</td><td>Basisqualifikation; <b>berichtet an Charge Nurse</b>; hands-on care: Anamnese, Vitalzeichen, Blut, Wunden, Medikamente, Edukation; Diplom/Bachelor</td></tr>
<tr><td><b>Student Nurse / Nurse Intern</b></td><td>Pflegestudent:in</td><td>in Ausbildung, im Praktikum betreut</td></tr>
<tr><td><b>Licensed Practical Nurse (LPN)</b></td><td>Pflegefachassistent:in</td><td>begrenzte Eigenständigkeit; Basispflege <b>unter Aufsicht der RN</b>: Blutdruck, Verbände, Katheterpflege; berichtet <i class="ru" data-en="nursing care assistant with more training">nursing care assistant with more training</i></td></tr>
<tr><td><b>Certified Nursing Assistant (CNA)</b></td><td>Pflegeassistent:in</td><td>Alltag: essen, waschen, Toilette, Mobilität, anziehen; Vitalzeichen je nach Einrichtung <i class="ru" data-en="nursing aide">nursing aide</i></td></tr>
<tr><td><b>Orderlies / Healthcare Assistants</b></td><td>Hilfskräfte</td><td><b>nicht</b> lizenziert, nicht-klinisch: Transport im Rollstuhl, Zimmer, Material/Proben bringen <i class="ru" data-en="porters, helpers">porters, helpers</i></td></tr></table></div>
<div class="box merk">Hierarchie: <b>CNO → Lead → Head → Charge → RN → LPN → CNA</b>. „Head = Haus (Station), Charge = Schicht“. Trial Quiz: „providing <b>and coordinating</b> patient care, educating patients and the public…“ → <b>RN</b>.</div>
<h3>Hospital staff roles (S. 11)</h3>
<p><b>HCPs</b> (health care professionals: doctors, nurses, pharmacists) – Behandlung &amp; laufende Pflege · <b>AHPs</b> (allied health professionals) – Diagnose, Therapie, Reha: <b>dietitians, occupational therapists, biomedical scientists, physiotherapists / physical therapists, speech and language therapists (SLT/SLP)</b> <i class="ru" data-en="non-doctor therapy professions">non-doctor therapy professions</i> · <b>support and administrative staff</b> – day-to-day running.</p>
<h3>Medical specialists (S. 12)</h3>
<div class="tw"><table><tr><th>Cardiologist</th><td>heart, blood vessels</td><th>Neonatologist</th><td>premature / critically ill newborns</td></tr>
<tr><th>ENT</th><td>upper respiratory tract (ears, nose, throat) <i class="ru" data-en="ear-nose-throat">ear-nose-throat</i></td><th>Pediatrician</th><td>infants, children, teenagers</td></tr>
<tr><th>Pulmonologist</th><td>lungs, airways</td><th>Traumatologist</th><td>injuries, fractures</td></tr>
<tr><th>Neurologist</th><td>brain, spinal cord, nerves</td><th>Dermatologist</th><td>skin, hair, nails</td></tr>
<tr><th>Psychiatrist</th><td>mental, emotional, behavioural health</td><th>Ophthalmologist</th><td>eyes, vision <i class="ru" data-en="eye doctor">eye doctor</i></td></tr>
<tr><th>Proctologist</th><td>colon, rectum, anus</td><th>Dentist</th><td>teeth, gums, oral health</td></tr>
<tr><th>Urologist</th><td>urinary tract, male reproductive tract</td><th>Allergologist</th><td>immune system, allergies</td></tr>
<tr><th>OB (Obstetrician)</th><td>pregnancy, childbirth, female reproductive health</td><th>Oncologist</th><td>cancer</td></tr>
<tr><th>Midwife</th><td>women during pregnancy and labor <i class="ru" data-en="birth nurse">birth nurse</i></td><th>Radiologist</th><td>imaging (X-rays, MRIs)</td></tr>
<tr><th>Surgeon</th><td>performs operations</td><th>Pathologist</th><td>tissue &amp; fluid samples</td></tr>
<tr><th>Anesthetist</th><td colspan="3">manages pain and sedation for surgeries – Trial Quiz: „specialist for pain … during an operation“ → <b>anaesthetist / anesthetist / anesthesiologist</b> <i class="ru" data-en="BrE anaesthetist, AmE anesthesiologist">BrE anaesthetist, AmE anesthesiologist</i></td></tr></table></div>
</section>

<!-- ============ 3 HOSPITAL ============ -->
<section class="sec" id="k3">
<h2>3 · In and around the hospital (S. 13–14) ★</h2>
<div class="tw"><table><tr><th></th><th>Clinic</th><th>Hospital</th></tr>
<tr><td>Größe</td><td>smaller facility</td><td>larger medical centre</td></tr>
<tr><td>Leistung</td><td><b>primary care</b>: check-ups, minor issues, vaccinations, basic treatments</td><td>wide range; <b>serious illnesses &amp; emergencies</b></td></tr>
<tr><td>Personal</td><td>usually run by <b>GP(s)</b></td><td>doctors, nurses, specialists, support staff</td></tr>
<tr><td>Zeiten</td><td>specific opening hours</td><td><b>open 24/7</b></td></tr>
<tr><td>Patienten</td><td>mainly <b>outpatients</b> <i class="ru" data-en="go home the same day">go home the same day</i></td><td><b>outpatients and inpatients</b> <i class="ru" data-en="stay overnight or longer">stay overnight or longer</i></td></tr></table></div>
<div class="tw"><table><tr><th></th><th>Primary care</th><th>Nursing care</th><th>Specialty care</th></tr>
<tr><td>Was</td><td>first-stop healthcare</td><td>care by registered nurses</td><td>expert care for specific issues</td></tr>
<tr><td>Wer</td><td>family physicians, pediatricians, NPs</td><td>nurses</td><td>cardiologists, neurologists, surgeons</td></tr>
<tr><td>Inhalt</td><td>basic needs, check-ups, common conditions</td><td>patient care, medication, wound care, emotional support, education</td><td>diagnosing &amp; treating complex conditions</td></tr>
<tr><td>Wo</td><td>clinics, doctors’ offices</td><td>hospitals → community centres, homes</td><td>mostly hospitals, specialized clinics</td></tr></table></div>
<p><b>Department</b> (größter Bereich, Fachrichtung) <b>&gt; Unit</b> (Teil eines Departments, spezialisiert) <b>&gt; Ward</b> (Bereich in einer Unit mit <b>Betten</b>; Pat. aufgenommen) <i class="ru" data-en="department &gt; unit &gt; ward">department &gt; unit &gt; ward</i></p>
<h3>Core concepts of nursing care (S. 14)</h3>
<ol><li><b>Health and Wellness</b> – well-being beyond the absence of disease</li><li><b>Patient-Centered Care</b> – individual preferences and values <i class="ru" data-en="the patient in the centre">the patient in the centre</i></li><li><b>Holistic Care</b> – physical, emotional, social, spiritual needs <i class="ru" data-en="whole person">whole person</i></li><li><b>Evidence-Based Practice</b> – scientific research and best practices</li><li><b>Ethical and Legal Considerations</b> – professional and ethical guidelines</li></ol>
<p>Orte (S. 42/44): <b>ICU</b> Intensivstation · <b>PACU</b> Aufwachraum · <b>OT/OR</b> OP-Saal · <b>A&amp;E</b> (BrE) = <b>ER</b> (AmE) Notaufnahme · <b>ENT department</b> HNO.</p>
</section>

<div class="box merk"><b>Definitionen zum Eintippen</b> (Trial Quiz Q1: „tube with a nozzle and piston or bulb used for drawing blood“ → <b>syringe</b>): <b>tourniquet</b> = macht Venen sichtbar (über der Einstichstelle) · <b>dressing</b> = steriler Pad auf der Wunde · <b>bandage</b> = hält die dressing · <b>splint</b> = vorübergehende Ruhigstellung · <b>cast</b> = Gips · <b>brace</b> = stützt Gelenke · <b>walker</b> = walking frame · <b>thermometer</b> = Temperatur · <b>stethoscope</b> = abhören (BP) · <b>TPR chart</b> = Temperature, Pulse, Respiration.</div>
</section>

<!-- ============ 6 ROUTINES ============ -->
<section class="sec" id="k6">
<h2>6 · Nursing routines (S. 19–25) ★ Präsentationen</h2>
<p><b>Presentation (Oral exam):</b> max. 5 min, 4 Fragen – <b>WHY</b> is it performed? <b>HOW</b> does it work? <b>WHAT equipment</b>? <b>WHAT considerations</b> (challenges, tips)? + kurzes Video. Punkte: Presentation 10 · Video 5 · Pronunciation 2.5 · Grammar 2.5; nicht ablesen.</p>
<h3>3.1 Drawing blood (S. 20) <i class="ru" data-en="venipuncture">venipuncture</i></h3>
<ol><li><b>Check and verify the doctor’s orders</b> (immer zuerst)</li><li><b>Two patient identifiers</b>: name + birth date ↔ chart / ID band</li><li>Patient informieren (Vene im Arm)</li><li>Equipment, Hände waschen, Handschuhe · Pat. macht <b>Faust</b>, Stelle in der <b>antecubital fossa</b> <i class="ru" data-en="inside of the elbow">inside of the elbow</i> (cephalic, median cubital, basilic vein)</li><li><b>Tourniquet above</b> the venipuncture site (Infografik: 3–4 inches)</li><li>Desinfektion: <b>70 % alcohol</b>, von der Mitte nach außen</li><li>Vene mit Daumen fixieren (anchor), Nadel <b>30°</b>, zügig einstechen</li><li><b>Tourniquet lösen, BEVOR die Nadel herauskommt</b></li><li><b>4×4 gauze</b> + tape; Pat. drückt – v. a. bei <b>anticoagulants / blood thinners</b> (Heparin, Lovenox, Coumadin) <i class="ru" data-en="blood clots more slowly">blood clots more slowly</i></li><li>Röhrchen sofort <b>8–10 × invert</b>; Nadel in <b>sharps container</b>; Handschuhe aus, Hände waschen; <b>label</b>: full name, patient ID, birth date, date of sample</li></ol>
<h3>3.2 Changing a dressing (S. 21/22)</h3>
<p><b>dressing</b> = sterile pad/compress auf der Wunde (Heilung, Schutz) · <b>bandage</b> hält die dressing.</p>
<ol class="cols2"><li>Check current dressing – <b>non-sterile gloves</b> (Selbstschutz)</li><li>Hand hygiene</li><li>Equipment: single patient use, <b>smallest size</b></li><li>Environment, position, bed height, <b>lights</b></li><li>Hand hygiene (<b>ABHR</b> = alcohol-based hand rub)</li><li>Sterile field + sterile supplies</li><li>Patient vorbereiten, Wunde freilegen</li><li>Non-sterile gloves</li><li>Outer dressing entfernen, entsorgen</li><li>Inner dressing mit <b>transfer forceps</b></li><li>Forceps + Handschuhe entsorgen</li><li><b>Sterile gloves</b>, Wunde beurteilen</li><li>Water-resistant underpad (optional)</li><li>Reinigen mit <b>saline</b>: 1 × <b>2×2 gauze pro Strich</b>, <b>clean → dirty</b>, <b>top → bottom</b>; suture line zuerst (least contaminated), von der Mitte zu einem Ende; trocknen; ggf. Antiseptikum</li><li>Inner dressing <b>4×4 gauze</b> mit forceps, dann drain site</li><li>Outer dressing – Innenseite zur Wunde</li><li>Abschluss: bequeme Lage, Bett runter, entsorgen, Händehygiene</li><li><b>Document</b></li><li><b>Compare</b> mit voriger Beurteilung</li></ol>
<h3>3.3 Taking vital signs (S. 22/23)</h3>
<div class="tw"><table><tr><th>Pulse</th><td>heart rate &amp; rhythm · <b>radial artery</b> (Innenseite Handgelenk, Daumenseite) · <b>first two fingertips, not the thumb</b> · <b>full minute</b> · auf Schläge konzentrieren</td></tr>
<tr><th>Respiration</th><td>rate, depth, pattern · Finger leicht <b>aufs Handgelenk</b> legen · 1 min · <b>inhale + exhale = 1 breath</b> · wheezing/distress notieren <i class="ru" data-en="wheezing = whistling sound">wheezing = whistling sound</i></td></tr>
<tr><th>Temperature</th><td>metabolic &amp; thermoregulatory function (Infektion, Entzündung, Hormone, Medikamente) · digital, disposable cover · <b>under the tongue</b>, Mund zu · nach dem Piepton ablesen, notieren · reinigen/sterilisieren</td></tr>
<tr><th>Blood pressure</th><td>force of blood against artery walls (hyper-/hypotension, stroke risk) · siehe Ablauf ↓</td></tr></table></div>
<div class="box"><b>BP – Reihenfolge (Trial Quiz!):</b> 1 clean hands + disinfected stethoscope → 2 sitzen, Arm auf <b>Herzhöhe</b>, Füße flach, Beine <b>nicht</b> gekreuzt → 3 <b>brachial artery</b> über dem Ellbogen → 4 cuff <b>über</b> dem Brachialispuls → 5 Stethoskop-Membran (diaphragm) <b>unter</b> der Manschette → 6 aufpumpen bis <b>170</b> → 7 langsam ablassen: <b>erster Ton = systolic, letzter = diastolic</b> → 8 document → 9 fully deflate &amp; remove.</div>
<h3>3.4 Administering an IV line (S. 24) <i class="ru" data-en="intravenous cannula">intravenous cannula</i></h3>
<p>Zweck: fluids, medications, nutrients direkt ins Blut. <b>1 Preparation:</b> physician’s order (fluid type, rate, duration) · supplies: IV catheter (appropriate <b>gauge</b>), IV start kit (tourniquet, antiseptic swab, gauze, tape, transparent dressing), saline flush, tubing &amp; fluids, gloves. <b>2 Patient:</b> vorstellen, erklären → <b>consent</b>; Arm lagern; tourniquet <b>4–6 inches</b> oberhalb; Vene: forearm/hand, <b>keine Gelenke, keine fragilen Venen</b>. <b>3 Insertion:</b> hand hygiene, gloves; antiseptic (alcohol/chlorhexidine), <b>trocknen lassen</b>; Vene straffen, <b>15–30°, bevel up</b>; <b>flashback</b> (blood return) → etwas vorschieben, Katheter ganz rein; <b>needle (stylet)</b> raus; extension set anschließen, <b>dann</b> tourniquet lösen; transparent dressing + tape. <b>4 Flushing:</b> saline → <b>patency</b> (kein Widerstand, keine Schwellung) <i class="ru" data-en="the line is open">the line is open</i>; Infusion anschließen; Rate mit <b>roller clamp</b> oder IV pump.</p>
<h3>3.5 ECG recording (S. 25)</h3>
<p>Elektrische Herzaktivität; Diagnose: arrhythmias, heart attacks, coronary heart disease, cardiomyopathy; <b>non-invasive, painless, quick</b>; bei chest pain, palpitations <i class="ru" data-en="feeling your heartbeat">feeling your heartbeat</i>, dizziness, shortness of breath. <b>1</b> erklären, Schmuck/Metall ab, hinlegen, <b>warmer Raum</b> (kein Zittern) · <b>2</b> Haut mit alcohol wipes; <b>10 electrodes</b>: 4 limb (inner wrists/ankles) + 6 chest (V1–V6); farbcodierte Kabel · <b>3</b> still liegen, normal atmen, entspannen · <b>4</b> 12-lead mode, Daten (name, age, date, time), record, alle 12 leads prüfen; <b>artifacts</b>: Elektroden prüfen, Haut reinigen, still halten · <b>5</b> beschriften (details, date, time, <b>initials</b>), speichern · <b>6</b> Elektroden vorsichtig ab, Haut prüfen, informieren, entsorgen/reinigen.</p>
</section>

<section class="sec" id="k7">
<h2>7 · Body, signs &amp; symptoms, minor injuries, first aid (S. 26–30) ★ S. 29/30</h2>
<div class="tw"><table><tr><th>Head</th><td>forehead, jaw, nose, skull <i class="ru" data-en="skull = bone of the head">skull = bone of the head</i></td><th>Leg</th><td>ankle, calf <i class="ru" data-en="back of the lower leg">back of the lower leg</i>, thigh <i class="ru" data-en="upper leg">upper leg</i>, shin <i class="ru" data-en="front of the lower leg">front of the lower leg</i>, knee, heel, femur</td></tr>
<tr><th>Torso</th><td>abdomen, chest, ribs, back</td><th>Internal organs</th><td>liver, pancreas, spleen <i class="ru" data-en="Milz">Milz</i>, kidney, stomach</td></tr>
<tr><th>Arm</th><td>elbow, wrist, palm, upper arm, fingers, thumb</td><th>Zuordnung offen</th><td>neck, shoulder, hip (je nach Lösung)</td></tr></table></div>
<p><b>Disease</b> = physiological/psychological <b>dysfunction</b> · <b>Illness</b> = <b>subjective</b> state, feels not well · <b>Sickness</b> = <b>social</b> dysfunction, sickness role (S. 27).<br>
<b>Sign</b> = observed <b>externally</b>: temperature, heart rate, colour, moisture · <b>Symptom</b> = felt <b>internally</b>: dizziness, nausea, fatigue, pain.</p>
<p><b>Health problems (Bild S. 28):</b> chicken pox, asthma, cough, broken leg, bleed, stomach ache, cold, headache, fever, backache, measles, faint, flu, earache, rash, itch, sore throat, swollen thumb, shivering, stuffy nose, heart attack, sneeze, toothache, sunburn, dizzy, retching <i class="ru" data-en="trying to vomit">trying to vomit</i>.</p>
<h3>Minor injuries and conditions (S. 29) ★</h3>
<div class="tw"><table class="eq"><tr><td>Abschürfung – <b>graze / scrape</b></td><td>Ausschlag – <b>rash</b></td><td>Beule – <b>bump</b></td></tr>
<tr><td>Biss; Stich – <b>bite; sting</b></td><td>Blauer Fleck – <b>bruise / hematoma</b></td><td>Bruch – <b>fracture</b></td></tr>
<tr><td>Durchfall – <b>diarrhea/diarrhoea</b></td><td>Verstopfung – <b>constipation</b></td><td>Entzündung – <b>inflammation</b></td></tr>
<tr><td>Fieber – <b>fever</b></td><td>Krankheit – <b>condition / disease / disorder / illness</b></td><td>Kratzer – <b>scratch</b></td></tr>
<tr><td>Schnittwunde – <b>cut</b></td><td>Schüttelfrost – <b>chills / shivering</b></td><td>Schwellung – <b>swelling</b></td></tr>
<tr><td>Sodbrennen – <b>heartburn</b></td><td>Verbrennung – <b>burn</b></td><td>Verbrühung – <b>scald</b></td></tr>
<tr><td>Verrenkung – <b>dislocation</b></td><td>Verstauchung – <b>sprain</b></td><td>Zerrung – <b>strain</b></td></tr>
<tr><td>wund; schmerzend – <b>sore</b></td><td>Schmerz – <b>ache / pain</b></td><td></td></tr></table></div>
<h3>First aid for common minor injuries (S. 30) ★</h3>
<div class="tw"><table><tr><th>Cuts &amp; scrapes</th><td>Hände waschen (Seife) · Wunde mit <b>kühlem Wasser + milder Seife</b> · Druck mit sauberem Tuch · <b>antibiotic ointment</b> + bandage</td></tr>
<tr><th>Minor burns &amp; scalds</th><td><b>cool (not cold)</b> running water <b>10–15 min</b> · sonst cool, wet compress · <b>kein Eis direkt</b> · locker mit sterile gauze bandage abdecken</td></tr>
<tr><th>Sprains &amp; strains</th><td><b>R.I.C.E.</b> – <b>R</b>est · <b>I</b>ce 15–20 min, mehrmals/Tag · <b>C</b>ompression bandage (firm, not tight) gegen Schwellung · <b>E</b>levation <b>über Herzhöhe</b></td></tr>
<tr><th>Insect bites &amp; stings</th><td>Stachel mit <b>tweezers</b> entfernen · Seife + Wasser · cold compress · <b>hydrocortisone cream</b> gegen Juckreiz · <b>antihistamine</b> bei allergischer Reaktion</td></tr>
<tr><th>Nosebleeds</th><td>aufrecht sitzen, <b>leicht nach vorne</b> beugen · weichen Teil der Nase <b>10 min</b> fest drücken · cold compress auf den <b>Nasenrücken</b> (bridge of the nose)</td></tr></table></div>
<div class="box">Trial Quiz Lückentext: „<b>Rest</b> the injured part. <b>Ice</b> it with a cold pack or ice wrapped in a cloth. <b>Compress</b> the area with a bandage which is firm, but not tight. <b>Elevate</b> the injured part.“</div>
</section>

<!-- ============ 8 ADMISSION ============ -->
<section class="sec" id="k8">
<h2>8 · Admitting a patient &amp; communication (S. 31–37) ★ S. 31–33</h2>
<div class="tw"><table><tr><th colspan="2">Arranged admission – von GP/Facharzt geplant, Termin</th></tr>
<tr><td><b>Day surgery / outpatient clinic</b></td><td>aufgenommen, Eingriff, <b>am selben Tag</b> heim; sonst Übernachtungsstation</td></tr>
<tr><td><b>General admission</b></td><td>kommt <b>einen Tag vorher</b>, bleibt bis zur Erholung</td></tr>
<tr><td><b>Pre-admission clinic</b></td><td>aktueller Check vor der OP; <b>Medikamentenliste mitbringen</b>; Tests: blood tests, chest x-ray, urine tests, ECG, sonography</td></tr>
<tr><th colspan="2">Emergency admission – Emergency Department nur für <b>akute</b> Fälle (nicht für Kleinigkeiten → GP, after-hours clinic)</th></tr>
<tr><td colspan="2">heart attack / chest pain · stroke · unconsciousness · difficulty breathing · seizures that do not stop · agitation &amp; disorientation for no apparent reason · severe allergic reaction · considerable blood loss · choking · major trauma · life-threatening diseases</td></tr></table></div>
<h3>How nurses admit patients (S. 31/32) – 5 Schritte</h3>
<ol><li><b>Greet the patient</b> – <b>vor</b> den Ärzt:innen; Wohlbefinden, Grund des Aufenthalts, Beziehung, Angst reduzieren</li><li><b>Record vital signs</b> – temperature, BP, pulse rate, respiration rate (+ Verletzungen)</li><li><b>Obtain a medical history</b> – allergies, previous illnesses &amp; surgeries, current medications, immunizations; family history (heart disease, diabetes, genetic illnesses)</li><li><b>Educate patients and their families</b> – Angst nehmen, Eingriffe erklären, Fragen beantworten → patient-centred care</li><li><b>Start basic treatment</b> – nach Rücksprache: Medikamente oral/IV, Proben (Blut, Urin)</li></ol>
<p><b>Question starters (S. 32):</b> What about / How about …? · Do you have / Have you got …? · Any problems …? · Have you ever had …? · When did you last …? · Do you think you can …? · Is it possible for you to …? · Are you able to …? · Could/Can you please …? · How often …? · <b>How many</b> (cigarettes)? · <b>How much</b> (alcohol)?</p>
<h3>Medical jargon → lay terms / euphemisms (S. 32/33) ★</h3>
<div class="tw"><table class="eq"><tr><td>abdomen → <b>stomach / belly / tummy</b></td><td>umbilicus → <b>navel / belly button</b></td><td>femur → <b>thigh bone</b></td></tr>
<tr><td>patella → <b>kneecap</b></td><td>tibia → <b>shinbone / shin</b></td><td>fibula → <b>calf bone</b></td></tr>
<tr><td>insomnia → <b>sleeping problems</b></td><td>dental prosthesis → <b>dentures / false teeth</b></td><td>faeces → <b>stool</b></td></tr>
<tr><td>to be incontinent → <b>difficulty controlling your bladder / bowels</b></td><td>flatulence → <b>to pass wind / have some gas</b></td><td>to urinate → <b>go to the bathroom / pass urine</b></td></tr>
<tr><td>to defecate → <b>go to the bathroom / have a bowel movement</b></td><td colspan="2">diarrhea / constipation → <b>loose stool / upset stomach / trouble with bowel movements</b> · <b>NICHT</b> „to pee“, „to poop“</td></tr></table></div>
<p><b>Warum?</b> Pat. ohne medizinischen Hintergrund → klar &amp; einfühlsam; Euphemismen bei intimen Themen → Pat. fühlt sich wohl, respektvoll, professionell.</p>
<h3>Active listening (S. 33/34)</h3>
<div class="tw"><table><tr><th>Active listening</th><td>Really?! · I see! · Mhmh! · Absolutely! (+ nonverbal: Blickkontakt, Nicken)</td></tr>
<tr><th>Open-ended</th><td>How are you? / How do you feel? · How has your week been? · Why? How? When? Where? · Tell me more about it!</td></tr>
<tr><th>Clarification</th><td>What exactly do you mean (by …)? · Can you explain that?</td></tr>
<tr><th>Empathy</th><td>I am sorry to hear that! · That must have been difficult for you! · How great! · Wonderful! · I’m glad to hear that!</td></tr></table></div>
<h3>Admission interview (S. 34–37)</h3>
<p><b>Personal details:</b> e-card / insurance number / social security number · DOB · referral (letter) · code word · <b>healthcare proxy</b> = trifft medizinische Entscheidungen für dich (medical power of attorney) <i class="ru" data-en="person who decides for you">person who decides for you</i> · <b>next of kin</b> = Kontakt im Notfall <i class="ru" data-en="closest relative">closest relative</i> · allergies · pacemaker · hearing aid · glasses / contact lenses · vaccination card. <b>Start:</b> What seems to be the trouble? · What brings you here today?<br>
<b>Respiration/Nutrition:</b> seizures / fits / convulsions · belching, heartburn · diet, intolerances. <b>Elimination:</b> catheter · bowel movements (BM) · laxatives.<br>
<b>Pain:</b> <u>location</u> (Where does it hurt? radiate?) · <u>quality &amp; severity</u> (throbbing, stabbing; continuous or comes and goes; scale 1–10) · <u>relieving/aggravating</u> (better/worse?) · <u>triggers</u> (What seems to bring it on?) · <u>time</u> (When did it begin?) · <u>other symptoms</u>.<br>
<b>Medication:</b> prescription, <b>OTC</b> (over-the-counter), herbal, supplements · painkillers (<b>NSAID</b> = nonsteroidal anti-inflammatory drug) · antihistamines · <b>laxatives</b> (constipated) · <b>anticoagulants</b> = blood thinners → alert card · steroids → steroid card · <b>sedatives</b> (sleeping pills) · antidepressants. Formen: pills/tablets, ointment, nasal spray, <b>suppositories</b> <i class="ru" data-en="Zäpfchen">Zäpfchen</i>, <b>lozenges</b> <i class="ru" data-en="Lutschtabletten">Lutschtabletten</i>, SQ injection, IV (transfusions, hydration, parenteral nutrition, rapid drugs).<br>
<b>Hygiene/skin:</b> well-groomed · retainer / braces / dentures (upper/lower jaw) · <b>bedsores = pressure sores</b> <i class="ru" data-en="pressure ulcers">pressure ulcers</i> · rash = skin eruption.<br>
<b>Mobilization:</b> dizziness, balance · walking aids: cane, crutch, walker (= walking frame), rollator, prosthetics · <b>brace</b> = Stütze für Gelenke · <b>cast</b> = Gips, Bruch komplett ruhig · <b>splint</b> = vorübergehend ruhig.<br>
<b>Sleeping:</b> sleep through the night · night sedation · snore · ear plugs. <b>History:</b> Are your parents alive and well? What did s/he die of? <b>Others:</b> The hospital does not accept liability for valuables · safe / locker · sign the form · reverse side.</p>
</section>

<!-- ============ 9 DISCHARGE & VOCAB ============ -->
<section class="sec" id="k9">
<h2>9 · Discharge, Vokabeln, Abkürzungen, Aussprache (S. 38–45)</h2>
<p><b>Discharge planning</b>: Pat. körperlich &amp; psychisch auf die Rückkehr in die eigene Umgebung vorbereiten; beteiligt: patient, family, friends, hospital &amp; community healthcare teams.</p>
<ol><li><b>Explain the paperwork thoroughly</b> – mit Pat. + Familie lesen, „to <b>ensure</b> they understand“; danach <b>„repeat back“</b>: why in hospital · how to <b>manage</b> at home · medications and why · follow-up plans (specialist visits, home care, physical therapy, lab work, diagnostic images)</li><li><b>Review medications</b> – neu, geändert, Apotheke; brand/generic name unbekannt → <b>pharmacist</b> fragen</li><li><b>Never make assumptions</b> – „<b>What questions do you have?</b>“ (offen); Transport, safety equipment (crutches, walkers, canes) + Gebrauch</li><li><b>Follow up</b> – Termine bei primary care provider/Fachärzt:innen, sofort vereinbaren; alle prescriptions &amp; referrals <i class="ru" data-en="referral = Überweisung">referral = Überweisung</i></li></ol>
<div class="box">Trial Quiz Lückentext (S. 38): „… to <b>ensure</b> they understand everything completely; <b>Remember</b> that after <b>reviewing</b> the discharge instructions, the patient should be able to repeat back. This <b>includes</b> telling you why they were in the hospital, how they will <b>manage</b> at home, what medications they <b>are</b> on and why …“</div>
<h3>Mixed vocabulary (S. 39) – Lösungen</h3>
<p>1 <b>sample</b> · 2 <b>wheelchair</b> · 3 <b>general practitioner</b> … <b>surgery</b> · 4 <b>surgeon</b> · 5 <b>constipated</b> (Trial Quiz!) · 6 <b>x-ray</b> · 7 <b>infectious</b> (Luft) … <b>contagious</b> (Kontakt) · 8 <b>hay fever</b> · 9 <b>Maternity Ward</b> · 10 <b>scald</b> · 11 <b>mumps</b> · 12 <b>general anaesthetic</b> · 13 <b>crutches</b> · 14 <b>measles</b> · 15 <b>insomnia</b> · 16 <b>midwife</b> · 17 <b>indigestion</b> · 18 <b>prescription</b> · 19 <b>scar</b> · 20 <b>antiseptic</b>. <span class="src">(Lösungen selbst aufgelöst – kein Schlüssel im Lehrbuch.)</span></p>
<h3>The body (S. 40/41)</h3>
<p>Head: brain, scalp <i class="ru" data-en="skin on top of the head">skin on top of the head</i>, forehead, tongue, throat, cheeks, chin, jaw, neck · Upper body: collar bone, chest, ribcage, waist, belly button (navel), back, spine · Arms: shoulders, armpit (axilla), triceps, elbow, wrist, thumb, pinky · Lower body: hips, buttocks (rear end), intestines, bladder, uterus · Legs: thigh, knee, shin (vorne), calf (hinten), ankle, toes.</p>

<h3>Pronunciation &amp; BrE/AmE (S. 43–45)</h3>
<p>/ˈ/ = nächste Silbe betont (baNAna) · <b>Silent P</b>: psychiatrist /saɪˈkaɪə.trɪst/, psychotherapist · <b>-itis</b> = „eye-tiss“ · <b>-aemia</b> = „ee-mee-uh“ (anaemia) · <b>ch → k</b>: ache /eɪk/ · <b>-algia</b> = „AL-juh“ (myalgia) · <b>dys</b> = „dis“ · <b>eu</b> = „you“ (neurologist) · <b>-cyte</b> = „site“ · <b>-osis</b> = „OH-sis“ · oedema /ɪˈdiː.mə/ · anaesthetist /əˈniːs.θə.tɪst/ (BrE).<br>
BrE ↔ AmE: anaesthesia/anesthesia · paediatric/pediatric · tumour/tumor · labour/labor · fibre/fiber · analyse/analyze · operating theatre (OT)/operating room (OR) · A&amp;E/ER · physiotherapist/physical therapist · APN/APRN · anaesthetist/anesthesiologist.</p>
</section>

<!-- ============ 10 MERKHILFEN ============ -->
<section class="sec" id="k10">
<h2>10 · Merkhilfen</h2>
<div class="box merk"><b>Head – Charge:</b> <b>H</b>ead = ganzes <b>H</b>aus (Station, Budget, Dienstplan). <b>Charge</b> = „in charge“ <b>nur während der Schicht</b>. <i class="ru" data-en="Head = whole ward, Charge = one shift">Head = whole ward, Charge = one shift</i></div>
<div class="box merk"><b>RN – LPN – CNA:</b> RN = „Real Nurse“ (volle Pflege, koordiniert, edukiert) · LPN = „Little Practical“ (Basispflege <b>unter</b> RN) · CNA = „Care for Normal Activities“ (essen, waschen, Toilette). <i class="ru" data-en="from full care to everyday help">from full care to everyday help</i></div>
<div class="box merk"><b>Department &gt; Unit &gt; Ward</b> – „<b>D</b>ie <b>U</b>hr <b>W</b>andert“ (groß → klein → Bett).</div>
<div class="box merk"><b>Sign vs Symptom:</b> <b>S</b>ign = <b>S</b>ee (sehen/messen), Sympt<b>om</b> = „<b>o</b>h <b>m</b>e“ (ich fühle es). <i class="ru" data-en="sign = seen, symptom = felt">sign = seen, symptom = felt</i></div>
<div class="box merk"><b>Disease – Illness – Sickness:</b> <b>D</b> = <b>D</b>octor findet es (Befund) · <b>I</b> = „<b>I</b> feel ill“ (subjektiv) · <b>S</b> = <b>S</b>ociety (Rolle, Krankenstand). <i class="ru" data-en="doctor / I / society">doctor / I / society</i></div>
<div class="box merk"><b>Tourniquet-Zahlen:</b> „<b>3-4 Blut, 4-6 Infusion</b>“ – die Infusion bleibt länger, also mehr Abstand. Lösen: <b>Blut</b> → vor Nadel raus; <b>IV</b> → nach Schlauch dran.</div>
<div class="box merk"><b>ECG:</b> „<b>10 Finger, 12 Monate</b>“ – 10 Elektroden, 12 Ableitungen. 4 Gliedmaßen + 6 Brust.</div>
<div class="box merk"><b>RICE</b> = <b>R</b>uhe, <b>I</b>ce, <b>C</b>ompress, <b>E</b>levate – im Trial Quiz genau als Verben: Rest · Ice · Compress · Elevate. <i class="ru" data-en="rest, ice, compress, raise">rest, ice, compress, raise</i></div>
<div class="box merk"><b>Sprain vs Strain:</b> spr<b>ai</b>n – Verst<b>au</b>chung (Bänder/Gelenk), s<b>tr</b>ain – Zerrung (Muskel; „<b>tr</b>aining“). <i class="ru" data-en="sprain = joint, strain = muscle">sprain = joint, strain = muscle</i></div>
<div class="box merk"><b>Burn vs Scald:</b> s<b>c</b>ald – <b>c</b>offee / heißes Wasser = Verbrühung. Burn = Verbrennung allgemein.</div>
<div class="box merk"><b>Admission 5 Schritte:</b> „<b>G</b>ood <b>V</b>itals <b>H</b>elp <b>E</b>very <b>T</b>reatment“ – Greet · Vitals · History · Educate · Treatment.</div>
<div class="box merk"><b>Discharge 4 Schritte:</b> „<b>P</b>apier, <b>M</b>edis, <b>N</b>ichts annehmen, <b>F</b>ollow up“ (P-M-N-F). Repeat back = <b>W</b>arum hier · <b>W</b>ie zu Hause · <b>W</b>elche Medis · <b>W</b>eiter (follow-up).</div>
<div class="box merk"><b>Blood pressure:</b> Manschette <b>über</b>, Stethoskop <b>unter</b> – „Manschette oben, Membran unten“. Erster Ton = <b>sys</b>tolisch („<b>s</b>tart“), letzter = diastolisch.</div>
</section>

<!-- ============ 11 FALLEN ============ -->
<section class="sec" id="k11">
<h2>11 · Fallen</h2>
<div class="box falle"><b>Tourniquet-Abstand:</b> Blutabnahme-Infografik <b>3–4 inches</b>, IV-Kapitel <b>4–6 inches</b>. In der Frage auf das Verfahren achten! <i class="ru" data-en="two different numbers in two chapters">two different numbers in two chapters</i></div>
<div class="box falle"><b>Tourniquet lösen:</b> Blutabnahme – <b>vor</b> dem Herausziehen der Nadel. IV – <b>nach</b> dem Anschließen des Schlauchs.</div>
<div class="box falle"><b>Nadelwinkel:</b> Blutabnahme <b>30°</b> · IV-Katheter <b>15–30°, bevel up</b>.</div>
<div class="box falle"><b>Handschuhe:</b> Infografik Blutabnahme sagt „put on <b>sterile</b> gloves“; Verbandswechsel: Kontrolle/Entfernen mit <b>non-sterile</b>, Wundbeurteilung/Reinigung mit <b>sterile</b> gloves. Händehygiene kommt beim Verbandswechsel <b>3×</b> vor (Schritte 2, 5, 17).</div>
<div class="box falle"><b>ECG:</b> „12-lead ECG“ heißt <b>nicht</b> 12 Elektroden – es sind <b>10</b>.</div>
<div class="box falle"><b>Respiration:</b> Finger liegen am <b>Handgelenk</b> (nicht an der Brust) – so steht es im Lehrbuch. Zählen <b>1 Minute</b>; inhale + exhale = 1 breath.</div>
<div class="box falle"><b>Pulse:</b> <b>nicht</b> mit dem Daumen; radial artery = Handgelenk (Daumenseite). <b>Brachial</b> artery = Blutdruck (über dem Ellbogen).</div>
<div class="box falle"><b>BP im Trial Quiz:</b> dort ein Schritt „Confirm the blood pressure monitor is …“ – steht <b>nicht</b> im Lehrbuch; und „Locate the brachial <b>pulse</b> on the patient’s arm“ statt „brachial artery just above the elbow“. Logisch: Gerät prüfen = Vorbereitung am Anfang.</div>
<div class="box falle"><b>Charge vs Head Nurse:</b> Die Übung S. 10 sagt bei Charge Nurse „manages a specific ward or department and supervises the nursing staff <b>on shift</b>“ – das Wort <b>shift</b> entscheidet → Charge.</div>
<div class="box falle"><b>Midwife vs OB:</b> beide „pregnancy“. Midwife = care during pregnancy and <b>labor</b>; OB = pregnancy, childbirth <b>and female reproductive health</b>.</div>
<div class="box falle"><b>ENT vs Pulmonologist:</b> ENT = <b>upper</b> respiratory tract; Pulmonologist = <b>lungs and airways</b>. Neurologist (Körper: Gehirn, Nerven) vs Psychiatrist (Psyche).</div>
<div class="box falle"><b>Infectious vs contagious</b> (S. 39): in der Übung infectious = auch <b>über die Luft</b>; contagious = <b>nur</b> direkter Kontakt.</div>
<div class="box falle"><b>Nasenbluten:</b> nach <b>vorne</b> beugen, nicht Kopf in den Nacken. <b>Burn:</b> cool, <b>not cold</b>, kein Eis direkt. <b>RICE:</b> Elevation <b>über Herzhöhe</b>.</div>
<div class="box falle"><b>Begrüßung:</b> Die Pflegekraft begrüßt den Pat. <b>vor</b> den Ärzt:innen.</div>
<div class="box falle"><b>How many / how much:</b> How <b>many</b> cigarettes (zählbar) · How <b>much</b> alcohol (nicht zählbar).</div>
<div class="box falle"><b>Rechtschreibung beim Eintippen:</b> anaesthetist (BrE) / anesthetist (AmE) – beide ok; <b>ophthalmologist</b> (ph-th!); <b>diarrhoea</b>/diarrhea; <b>syringe</b>; <b>tourniquet</b>; <b>constipated</b>.</div>
</section>

/* Offene Fragen: q = Frage, pts = Kernpunkte zum Abhaken, a = Musterantwort (einfaches Englisch, B1) */
const OPEN=[
 {id:"o_clinic",t:2,q:"What is the difference between a clinic and a hospital?",
  pts:["Clinic: smaller facility, primary care","Clinic: routine check-ups, minor problems, vaccinations, basic treatments","Clinic: usually run by GP(s), specific opening hours","Clinic: mainly outpatients","Hospital: larger, wide range of services, serious illnesses and emergencies","Hospital: doctors, nurses, specialists, support staff; open 24/7","Hospital: outpatients AND inpatients"],
  a:"A clinic is a smaller medical facility. It provides primary care, for example routine check-ups, vaccinations and basic treatments for minor health problems. It is usually run by a GP and has specific opening hours. It mainly treats outpatients – patients who come for an appointment and go home the same day.\nA hospital is a larger medical centre. It offers a wide range of services and treats serious illnesses and emergencies. It is staffed with doctors, nurses, specialists and support staff and it is open 24/7. A hospital treats outpatients and inpatients – patients who stay overnight or longer."},
 {id:"o_care",t:2,q:"Explain the difference between primary care, nursing care and specialty care.",
  pts:["Primary care: first-stop healthcare for all-around needs","Primary care: family physicians, pediatricians, nurse practitioners; clinics/doctors’ offices","Nursing care: provided by registered nurses in hospitals, clinics, homes, community centres","Nursing care: patient care, medication, wound care, emotional support, education","Specialty care: expert care for specific issues by cardiologists, neurologists, surgeons","Specialty care: diagnosing and treating complex conditions, mostly in hospitals"],
  a:"Primary care is the first stop for all health needs. Family doctors, pediatricians and nurse practitioners give it, usually in clinics or doctors’ offices. It covers check-ups and common conditions.\nNursing care is given by registered nurses in hospitals, clinics, homes and community centres. It covers patient care, medication, wound care, emotional support and education.\nSpecialty care is expert care for specific health problems. Specialists like cardiologists, neurologists and surgeons diagnose and treat complex conditions, mostly in hospitals or specialized clinics."},
 {id:"o_dept",t:2,q:"What is the difference between departments, units and wards?",
  pts:["Department: larger section of a hospital","Department: dedicated to specific specialities or services","Unit: smaller division within a department, specialised care","Ward: area within a unit where patients receive care","Ward: patients are admitted and stay (beds)"],
  a:"A department is a large section of a hospital for a specific medical speciality or service. A unit is a smaller part of a department and often gives specialised care. A ward is an area inside a unit where patients are admitted and stay in beds."},
 {id:"o_core",t:2,q:"Name and explain the five core concepts of nursing care.",
  pts:["Health and Wellness – well-being beyond the absence of disease","Patient-Centered Care – respect individual preferences and values","Holistic Care – physical, emotional, social and spiritual needs","Evidence-Based Practice – scientific research and best practices","Ethical and Legal Considerations – professional and ethical guidelines"],
  a:"1. Health and Wellness: we promote well-being, not only the absence of disease. 2. Patient-Centered Care: we respect the patient’s preferences and values. 3. Holistic Care: we look at physical, emotional, social and spiritual needs. 4. Evidence-Based Practice: we use scientific research and best practices. 5. Ethical and Legal Considerations: we follow professional and ethical guidelines."},
 {id:"o_staff",t:1,q:"Describe the roles of the Head Nurse, the Charge Nurse and the Registered Nurse.",
  pts:["Head Nurse: oversees one entire ward/unit","Head Nurse: responsible for nursing (and cleaning) staff, evaluates performance, budgeting, scheduling","Charge Nurse: responsible for a ward during his/her shift","Charge Nurse: point of contact, assigns patients to nurses, solves immediate issues, smooth handovers","Registered Nurse: hands-on patient care (history, vital signs, blood, wound care, medications, education)","Registered Nurse: reports to the charge nurse; diploma/bachelor’s degree"],
  a:"The Head Nurse (Stationsleitung) leads one whole ward. She is responsible for all nursing staff, evaluates their performance and manages the budget, the staff schedule and supplies.\nThe Charge Nurse (Schichtleitung) is responsible for the ward during one shift. She is the contact person for staff and doctors, assigns patients to nurses and makes sure handovers go smoothly.\nThe Registered Nurse gives hands-on care: she takes the medical history, takes vital signs, draws blood, changes dressings, gives medication and educates patients and families. She reports to the charge nurse."},
 {id:"o_lpncna",t:1,q:"What is the difference between an LPN and a CNA?",
  pts:["LPN = Pflegefachassistent:in, limited independent clinical authority","LPN: basic medical and nursing care under RN supervision (blood pressure, changing bandages, catheter care)","LPN: reports the patient’s status to nurses/doctors","CNA = Pflegeassistent:in: basic everyday care (eating, bathing, toilet, mobility, dressing)","CNA: may take vital signs depending on the facility and reports changes"],
  a:"An LPN (Pflegefachassistent:in) gives basic medical and nursing care under the supervision of a registered nurse, for example checking blood pressure, changing bandages or catheter care. She reports the patient’s status to nurses or doctors.\nA CNA (Pflegeassistent:in) helps patients with everyday tasks like eating, bathing, going to the toilet, moving and getting dressed. Depending on the facility, a CNA may take vital signs and report changes to the nurses."},
 {id:"o_ahp",t:1,q:"What are allied health professionals? Give examples.",
  pts:["Healthcare workers who provide diagnostic, therapeutic and support services","Prevent diseases, diagnose, treat, support rehabilitation – part of a team","Examples: dietitians, occupational therapists, biomedical scientists, physiotherapists, speech and language therapists"],
  a:"Allied health professionals (AHPs) are healthcare workers who give diagnostic, therapeutic and support services. They help to prevent diseases, diagnose conditions, treat patients and support rehabilitation, usually as part of a team. Examples are dietitians, occupational therapists, biomedical scientists, physiotherapists and speech and language therapists."},
 {id:"o_bp",t:5,q:"How do you measure a patient’s blood pressure? Describe the steps.",
  pts:["Clean hands, disinfected stethoscope","Patient seated, arm at heart level, feet flat, legs uncrossed","Locate brachial artery above the elbow; cuff above the brachial pulse","Stethoscope diaphragm over the brachial artery below the cuff","Inflate to about 170","Release slowly: first thump = systolic, last thump = diastolic","Document, then fully deflate and remove the cuff"],
  a:"First I clean my hands and disinfect the stethoscope. The patient sits with the arm at heart level, feet flat and legs not crossed. I find the brachial artery just above the elbow and wrap the cuff around the arm above it. I put the stethoscope’s diaphragm on the artery below the cuff. I inflate the cuff, usually until the dial reads 170. Then I slowly release the air and listen: the first thump is the systolic pressure, the last thump is the diastolic pressure. I document the readings and any unusual findings. At the end I fully deflate and remove the cuff."},
 {id:"o_dress",t:5,q:"What is a dressing? Describe the most important steps of a simple dressing change.",
  pts:["Dressing = sterile pad/compress on a wound; bandage holds it in place","Check old dressing with non-sterile gloves; hand hygiene; equipment (single use, smallest size)","Prepare environment and patient (bed height, lights), sterile field","Remove outer dressing (non-sterile gloves), inner dressing with transfer forceps","Sterile gloves, assess wound","Cleanse with saline: one gauze per stroke, clean to dirty, top to bottom; suture line first","Inner dressing 4×4 gauze with forceps, outer dressing (inside touching wound)","Comfortable position, lower bed, discard, hand hygiene, document, compare with previous assessment"],
  a:"A dressing is a sterile pad that is put on a wound to help healing and to protect it. A bandage holds the dressing in place.\nFirst I check the old dressing with non-sterile gloves and do hand hygiene. I gather the equipment, prepare the room and the patient and turn on the lights. I prepare a sterile field. With non-sterile gloves I remove the outer dressing, and the inner dressing with transfer forceps. Then I put on sterile gloves and assess the wound. I clean it with saline – one gauze per stroke, from clean to dirty and from top to bottom. I put on the inner dressing with forceps and then the outer dressing. Finally I help the patient into a comfortable position, lower the bed, throw away the material, clean my hands, document and compare the wound with the last assessment."},
 {id:"o_blood",t:5,q:"What is important when drawing blood?",
  pts:["Check and verify the doctor’s orders","Two patient identifiers (name, birth date vs chart/ID band)","Inform the patient","Tourniquet above the venipuncture site","Disinfect (70% alcohol, centre outwards); needle about 30°","Release tourniquet before withdrawing the needle","4×4 gauze + tape; patient holds pressure, especially on anticoagulants (Heparin, Lovenox, Coumadin)","Needle in sharps container; label the tube"],
  a:"First I check the doctor’s orders. I identify the patient with two identifiers: I ask for the name and birth date and compare them with the chart or ID band. I tell the patient that I am going to draw blood from a vein in the arm. I apply the tourniquet above the puncture site, disinfect the skin and insert the needle. Before I pull out the needle I release the tourniquet. Then I put a 4×4 gauze on the site, tape it and ask the patient to press on it – especially if the patient takes blood thinners like heparin, because the blood clots more slowly. The needle goes into the sharps container and I label the tube."},
 {id:"o_iv",t:5,q:"Why and how is an IV line administered? Name the main steps.",
  pts:["Delivers fluids, medications and nutrients directly into the bloodstream","Verify physician’s order (fluid type, rate, duration); gather supplies","Explain the procedure, gain consent; tourniquet 4–6 inches above; select vein (avoid joints)","Hand hygiene, gloves; clean with antiseptic and let dry","Insert catheter at 15–30°, bevel up; flashback → advance catheter; remove stylet","Attach tubing, release tourniquet, secure with transparent dressing","Flush with saline (patency), connect fluids, adjust rate (roller clamp / pump)"],
  a:"An IV line is used to give fluids, medications and nutrients directly into the bloodstream. First I check the physician’s order and gather the supplies. I explain the procedure to get consent, apply a tourniquet 4 to 6 inches above the site and choose a good vein, for example on the forearm, not on a joint. After hand hygiene and gloves I clean the skin with an antiseptic and let it dry. I insert the catheter at 15 to 30 degrees, bevel up. When I see the flashback, I advance the catheter, remove the needle, attach the tubing and release the tourniquet. I secure it with a transparent dressing, flush it with saline to check patency, connect the fluids and adjust the rate."},
 {id:"o_ecg",t:5,q:"What is an ECG and how do you record it?",
  pts:["Records the heart’s electrical activity; non-invasive, painless, quick","Diagnoses arrhythmias, heart attacks, coronary heart disease, cardiomyopathy; for chest pain, palpitations, dizziness, shortness of breath","Prepare: explain, remove jewelry, lie down, warm room","Clean skin with alcohol; 10 electrodes: 4 limb + 6 chest (V1–V6)","Patient stays still, breathes normally","12-lead mode, enter details, record, check tracings (artifacts)","Label printout, save; remove electrodes, check skin, dispose"],
  a:"An ECG records the electrical activity of the heart. It is non-invasive, painless and quick. It helps to diagnose arrhythmias, heart attacks or coronary heart disease and is used for chest pain, palpitations, dizziness or shortness of breath.\nI explain the procedure, the patient removes jewelry and lies down in a warm room. I clean the skin with alcohol wipes and attach 10 electrodes – 4 on the limbs and 6 on the chest. The patient should stay still and breathe normally. I select the 12-lead mode, enter the patient details and record. I check that the tracing is clear, label and save it, remove the electrodes and check the skin."},
 {id:"o_vital",t:5,q:"What are vital signs and what does each one tell us?",
  pts:["Four vital signs: pulse, respiration, temperature, blood pressure","Pulse: heart rate and rhythm (circulation, cardiac problems)","Respiration: rate, depth and pattern (lung function, oxygenation, distress)","Temperature: metabolic/thermoregulatory function (infection, inflammation, hormones, drug reactions)","Blood pressure: force of blood against artery walls (hypertension/hypotension, stroke risk)"],
  a:"Vital signs are four key health indicators: pulse, respiration, temperature and blood pressure. The pulse shows heart rate and rhythm. Respiration – the rate, depth and pattern of breathing – shows how well the lungs work. Body temperature can show infections, inflammation, hormonal problems or reactions to medication. Blood pressure is the force of the blood against the artery walls; it can show hypertension or hypotension and the risk of stroke."},
 {id:"o_sign",t:6,q:"Explain the difference between a sign and a symptom. Give examples.",
  pts:["Sign: can be observed / measured externally","Examples of signs: temperature, heart rate, colour, moisture","Symptom: felt internally by the patient","Examples of symptoms: dizziness, nausea, fatigue, pain"],
  a:"A sign is something other people can see or measure from the outside, for example temperature, heart rate, skin colour or moisture. A symptom is something the patient feels inside, for example dizziness, nausea, fatigue or pain."},
 {id:"o_dis",t:6,q:"What is the difference between disease, illness and sickness?",
  pts:["Disease: physiological or psychological dysfunction","Illness: subjective state – the person feels not well","Sickness: social dysfunction – the role a person takes when ill (sickness role)"],
  a:"A disease is a physiological or psychological dysfunction of the body. An illness is the subjective feeling of the person that he or she is not well. Sickness is a social state: the role a person takes when he or she is ill, the sickness role."},
 {id:"o_rice",t:6,q:"A patient has sprained his ankle. What do you do? Explain R.I.C.E.",
  pts:["Rest the injured area","Ice packs 15–20 minutes at a time, several times a day","Compression bandage (firm but not tight) to reduce swelling","Elevate above heart level"],
  a:"I use the R.I.C.E. method. R – Rest: the patient rests the injured ankle. I – Ice: I put an ice pack on it for 15 to 20 minutes at a time, several times a day. C – Compression: I use a compression bandage that is firm but not tight to reduce the swelling. E – Elevation: the ankle is raised above the level of the heart."},
 {id:"o_burn",t:6,q:"First aid for a minor burn and for a nosebleed – what do you do?",
  pts:["Burn: cool (not cold) running water 10–15 minutes","Burn: cool wet compress if no running water; no ice directly","Burn: cover loosely with sterile gauze","Nosebleed: sit upright and lean slightly forward","Nosebleed: pinch the soft part of the nose 10 minutes","Nosebleed: cold compress on the bridge of the nose"],
  a:"For a minor burn I cool it under cool, not cold, running water for 10 to 15 minutes. Without running water I use a cool, wet compress. I never put ice directly on the burn. Then I cover it loosely with sterile gauze.\nFor a nosebleed the patient sits upright and leans forward a little. He pinches the soft part of the nose firmly for 10 minutes, and I put a cold compress on the bridge of the nose."},
 {id:"o_admit",t:7,q:"How do nurses admit patients? Describe the five steps.",
  pts:["Greet the patient (before the physician) – comfort, relationship, reduce anxiety","Record vital signs (temperature, BP, pulse, respiration)","Obtain a medical history (allergies, illnesses, surgeries, medications, immunizations, family history)","Educate patient and family – explain procedures, answer questions","Start basic treatment after talking to physicians (medication oral/IV, blood and urine samples)"],
  a:"1. I greet the patient before the doctor does. I want the patient to feel comfortable, build a relationship and reduce anxiety. 2. I record the vital signs: temperature, blood pressure, pulse and respiration. 3. I take the medical history: allergies, previous illnesses and operations, current medications, vaccinations and family history. 4. I educate the patient and the family, explain the procedures and answer their questions. 5. After talking to the doctors I start basic treatment, for example medication by mouth or IV, or I take blood and urine samples."},
 {id:"o_arr",t:7,q:"What is the difference between an arranged and an emergency admission? Give examples.",
  pts:["Arranged: planned by GP/specialist, patient has an appointment","Day surgery: home the same day","General admission: a day before the operation, stays for recovery","Pre-admission clinic: medical check before surgery, bring medication list, tests (blood, x-ray, urine, ECG, sonography)","Emergency: acute problems only, not minor/long-standing","Examples: heart attack/chest pain, stroke, unconsciousness, difficulty breathing, seizures, severe allergy, blood loss, choking, major trauma"],
  a:"An arranged admission is planned by the GP or a specialist; the patient has an appointment. In day surgery the patient goes home on the same day. In a general admission the patient comes a day before the operation and stays until recovery. In a pre-admission clinic the patient has a medical check before surgery and brings a list of medications; tests can be blood tests, a chest x-ray, urine tests, an ECG or sonography.\nAn emergency admission is only for acute problems, for example a heart attack, a stroke, unconsciousness, difficulty breathing, seizures that do not stop, a severe allergic reaction, a lot of blood loss, choking or major trauma."},
 {id:"o_lay",t:7,q:"Why should nurses use lay terms and euphemisms? Give examples.",
  pts:["Patients often have no medical background – communicate clearly and sensitively","Euphemisms for intimate topics: patients feel at ease, respectful and professional","Lay terms: abdomen → belly/tummy, patella → kneecap, femur → thigh bone, insomnia → sleeping problems","Euphemisms: faeces → stool, flatulence → pass wind, urinate → pass urine, defecate → have a bowel movement","Avoid “pee” / “poop”"],
  a:"Many patients have no medical background, so nurses must explain things clearly and sensitively in lay terms, for example belly instead of abdomen, kneecap instead of patella, or sleeping problems instead of insomnia. For intimate topics nurses use euphemisms, so the patient feels at ease: stool instead of faeces, to pass wind instead of flatulence, to pass urine or to have a bowel movement. Childish words like “pee” or “poop” are not professional."},
 {id:"o_listen",t:7,q:"What is active listening? Give useful phrases.",
  pts:["Important for patient-centred care and for getting medical information","Shows the patient you care, builds trust","Active listening: Really?! I see! Mhmh! Absolutely!","Open-ended questions: How do you feel? Tell me more about it!","Clarification: What exactly do you mean? Can you explain that?","Empathy: I am sorry to hear that! That must have been difficult for you!"],
  a:"Active listening is very important for patient-centred care and helps to get important medical information. It shows the patient that I care and builds trust. I use short reactions like “I see!”, “Mhmh!” or “Really?!”. I ask open-ended questions like “How do you feel?” or “Tell me more about it!”. If something is not clear I ask “What exactly do you mean?”. To show empathy I say “I am sorry to hear that!” or “That must have been difficult for you!”."},
 {id:"o_pain",t:7,q:"Which questions do you ask a patient about pain?",
  pts:["Location: Where does it hurt? Does it radiate?","Quality/severity: What’s the pain like (throbbing, stabbing)? Scale 1–10","Relieving/aggravating factors: Anything that makes it better or worse?","Triggers: What seems to bring it on?","Time: When did it start? How long does it last?","Other symptoms; medication: Have you taken anything for it?"],
  a:"I ask where it hurts and if the pain stays in one place or radiates. I ask what the pain is like, for example throbbing or stabbing, and how strong it is on a scale from 1 to 10. I ask if anything makes it better or worse and what seems to bring it on. I ask when it started and how long it lasts, if there are other problems, and if the patient has taken anything for it."},
 {id:"o_disch",t:8,q:"What are the main duties of a nurse when discharging a patient?",
  pts:["Explain the paperwork thoroughly with patient and family","Patient can “repeat back”: why in hospital, how to manage at home, medications and why, follow-up plans","Review medications: new ones, changes, how to get them from the pharmacy; ask the pharmacist about unfamiliar names","Never make assumptions: ask “What questions do you have?”","Arrange transport, safety equipment (crutches, walkers, canes) and how to use it","Follow up: appointments with GP/specialists asap, all prescriptions and referrals"],
  a:"1. I explain the discharge paperwork to the patient and the family. After that the patient should be able to repeat back why he was in hospital, how he will manage at home, which medications he takes and why, and the follow-up plans. 2. I review the medications: new medications, changes, and how to get them from the pharmacy. 3. I never make assumptions – I ask “What questions do you have?”. I arrange transport and make sure the patient has crutches or a walker and knows how to use them. 4. Follow-up: I explain why the next appointments are important, and the patient should make them as soon as possible. He needs all prescriptions and referrals."},
 {id:"o_ff",t:3,q:"Explain five false friends in medical English and the correct word.",
  pts:["Ambulanz = outpatient clinic (ambulance = Krankenwagen)","Station = ward (station = Bahnhof)","Rezept = prescription (recipe = Kochrezept)","Probe = sample (probe = Sonde)","bekommen = to get/receive (become = werden)","Visite = ward round (visit = Besuch); nüchtern = fasting (sober = nicht betrunken)"],
  a:"In German we say Ambulanz, but in English it is an outpatient clinic – an ambulance is a Krankenwagen. A Station is a ward in English; a station is a Bahnhof. A Rezept from the doctor is a prescription; a recipe is for cooking. A Probe is a sample, for example a stool sample; a probe is a Sonde. And patients do not “become” medication – they get or receive it, because “become” means werden."}
];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function examPool(){ return B.filter(q=>!cfg.sc||q.k!=="mc"); }
function examSet(){
  const pool=examPool(), n=cfg.n;
  const per={};pool.forEach(q=>(per[q.t]=per[q.t]||[]).push(q));
  const tl=Object.keys(per); const base=Math.floor(n/Math.max(1,tl.length));
  let out=[];tl.forEach(t=>out.push(...shuffle(per[t]).slice(0,base)));
  const rest=shuffle(pool.filter(q=>!out.includes(q)));out=out.concat(rest.slice(0,Math.max(0,n-out.length)));
  return shuffle(out).slice(0,n);
}
